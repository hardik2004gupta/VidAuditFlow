# Removed as part of Phase 2 (backend foundation modernization) dependency
# cleanup -- PROJECT_AUDIT.md / TECHNICAL_DEBT.md TD-8 flagged these as
# declared but never imported anywhere in the codebase:
#   streamlit, redis, firecrawl-py, pandas
# `requests` was also removed: `services/video_indexer.py` now uses
# `httpx.AsyncClient` exclusively.
#
# Phase 4 note: `sqlmodel` (which pulls in `sqlalchemy` transitively),
# `alembic`, `aiosqlite` (async SQLite driver, local dev), and `asyncpg`
# (async Postgres driver, production) were re-added deliberately now that
# DATABASE_PLAN.md's persistence layer is actually being implemented --
# `psycopg2-binary` (the old *sync* Postgres driver) is intentionally NOT
# re-added since the whole backend is async; `asyncpg` is its async
# equivalent.
